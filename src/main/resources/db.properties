# ---- Database settings (read by util/DBUtil.java) ----
# Default: H2 embedded database stored in your home folder (no installation needed).
# MODE=MySQL makes H2 understand MySQL-style SQL, so the same schema works on MySQL.
db.driver=org.h2.Driver
db.url=jdbc:h2:file:${user.home}/campus-lostfound-data/campusdb;MODE=MySQL
db.user=sa
db.password=

# ---- To use MySQL instead ----
# 1. Add the mysql-connector-j dependency to pom.xml
# 2. Create the database:  CREATE DATABASE campus_lostfound;
# 3. Comment out the 4 lines above and use these:
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/campus_lostfound?useSSL=false&serverTimezone=UTC
# db.user=root
# db.password=your_mysql_password
